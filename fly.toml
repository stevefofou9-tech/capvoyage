# ========================================================
# fly.toml - Configuration de Déploiement Fly.io
# Application : CapVoyage (Travel Planner)
# Mode : Conteneurisé avec volume persistant SQLite (WAL)
# Documentation : https://fly.io/docs/reference/configuration/
# ========================================================

app = "capvoyage"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/app/data/capvoyage.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Volume persistant pour la base SQLite WAL et le stockage
[mounts]
  source = "capvoyage_data"
  destination = "/app/data"
  initial_size = "1gb"

# Sonde de santé applicative
[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Spécification Machine (Légère & Économique)
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

