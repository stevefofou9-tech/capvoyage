name: CapVoyage CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -----------------------------------------------------------
  # Étape 1 : Tests (domaine, intégration, API HTTP, navigateur)
  # Le nombre de tests est affiché par `npm test` (ℹ tests N).
  # -----------------------------------------------------------
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x, 24.x ]

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Vérification syntaxique des modules servis au navigateur
        run: for f in src/ui/*.js src/domain/*.js; do node --check "$f"; done

      - name: Exécution de toutes les suites (dont le parcours Chrome headless)
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # -----------------------------------------------------------
  # Étape 2 : Déploiement continu vers Fly.io
  # Conditionné au succès complet des tests
  # -----------------------------------------------------------
  deploy:
    name: Déploiement Continu sur Fly.io
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de l'outil CLI flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Déploiement vers Fly.io avec build distant
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
