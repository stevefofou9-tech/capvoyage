<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Actualiser CapVoyage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="reset-page">
  <main class="reset-card" role="main">
    <h1>🧭 Actualisation de CapVoyage</h1>
    <p id="reset-status" role="status" aria-live="polite">Nous mettons votre application à jour…</p>
    <p class="reset-reassure">Vos voyages et vos modifications en attente ne sont pas effacés : seule la copie de l'application stockée sur votre appareil est renouvelée.</p>
    <a class="btn btn-secondary" id="reset-continue" href="/" hidden>Ouvrir CapVoyage</a>
  </main>
  <script type="module" src="reset.js"></script>
</body>
</html>
